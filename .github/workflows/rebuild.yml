name: Quarterly Data Refresh & Deploy

on:
  schedule:
    # 每季度第一个周一 08:17 (北京时间) = 周日 00:17 UTC
    # 与财报季同步: 1月(年报预告)、4月(一季报+年报)、7月(中报预告)、10月(三季报)
    - cron: '17 0 * * 1'
  workflow_dispatch:

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Fetch latest data from Google Sheets
        run: npm run fetch-data
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Generate AI industry insights
        run: npm run generate-insights
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Commit & push if data changed
        run: |
          git config user.name "data-bot"
          git config user.email "bot@pta-research.local"
          git add src/data/*.json
          if git diff --staged --quiet; then
            echo "No data changes, skipping push."
          else
            git commit -m "data: auto-refresh from Google Sheets $(date +%Y-%m-%d)"
            git push
            echo "Data updated and pushed."
          fi

      - name: Build
        run: npm run build
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
